name: Build release package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, curl, dom, fileinfo, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare release folders
        run: |
          mkdir -p deploy/laravel
          mkdir -p deploy/public_html

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='docker-compose.yml' \
            --exclude='public/build/' \
            --exclude='public/hot' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='deploy/' \
            ./ deploy/laravel/

          cp -a public/. deploy/public_html/

      - name: Create zip files
        run: |
          (cd deploy/laravel && zip -rq ../../laravel.zip .)
          (cd deploy/public_html && zip -rq ../../public_html.zip .)
          ls -lh laravel.zip public_html.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentra-release
          path: |
            laravel.zip
            public_html.zip
          retention-days: 7