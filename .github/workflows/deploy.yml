name: Deploy SENTRA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sentra-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Upload Laravel application files, preserving production-only files.
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: laravel/
          state-name: .ftp-deploy-laravel-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/**
            **/.env
            **/.env.*
            **/public/**
            **/deploy/**
            **/out/**
            **/tests/**
            **/coverage/**
            **/.idea/**
            **/.vscode/**

      # Upload public files and compiled Vite assets, but preserve the custom
      # production index.php that points Laravel at the separate app directory.
      - name: Deploy public files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: sentra.ge/public_html/
          state-name: .ftp-deploy-public-state.json
          dangerous-clean-slate: false
          exclude: |
            index.php
            hot
            .env
            .env.*
            **/.git*
            **/node_modules/**

      - name: Verify production homepage
        run: |
          set -eu
          html="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 https://sentra.ge/)"
          echo "$html" | grep -Eq 'build/assets/[^"]+\.js'
          echo "Deployment verified: homepage includes a JavaScript bundle."
